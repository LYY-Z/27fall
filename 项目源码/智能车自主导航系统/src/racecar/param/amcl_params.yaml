amcl:
  ros__parameters:
    use_map_topic: true
    first_map_only: true
    tf_broadcast: true
    odom_frame_id: "odom"
    global_frame_id: "map"
    base_frame_id: "base_footprint"
    scan_topic: "scan"
    min_particles: 100
    max_particles: 5000
    kld_err: 0.01
    kld_z: 0.99
    update_min_d: 0.2
    update_min_a: 0.1
    resample_interval: 2
    transform_tolerance: 0.1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.1
    laser_max_beams: 30
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_z_hit: 0.5
    laser_z_short: 0.05
    laser_z_max: 0.05
    laser_z_rand: 0.5
    laser_sigma_hit: 0.2
    laser_lambda_short: 0.1
    odom_alpha1: 0.2
    odom_alpha2: 0.2
    odom_alpha3: 0.8
    odom_alpha4: 0.2
    initial_cov_xx: 0.25
    initial_cov_yy: 0.25
    initial_cov_aa: 0.2
