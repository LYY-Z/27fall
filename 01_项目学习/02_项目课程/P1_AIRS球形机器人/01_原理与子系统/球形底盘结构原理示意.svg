<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker>
  <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ea580c"/></marker>
  <marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <style>
  text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}
  .title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.label{font-size:20px}.small{font-size:17px}.blue{fill:#1d4ed8}.orange{fill:#c2410c}.muted{fill:#475569}
  </style>
</defs>
<rect width="1500" height="930" fill="#f8fafc"/>
<text x="750" y="48" text-anchor="middle" class="title">球形底盘：机身—驱动轮—球—地面的机械关系</text>

<!-- SIDE VIEW -->
<rect x="35" y="82" width="870" height="730" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="470" y="125" text-anchor="middle" class="head">侧视概念图：轮子装在机身支架上，压着球面</text>
<!-- floor -->
<line x1="90" y1="714" x2="850" y2="714" stroke="#334155" stroke-width="5"/>
<text x="800" y="749" class="label">地面</text>
<!-- sphere -->
<circle cx="475" cy="535" r="180" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
<path d="M305 535 A170 170 0 0 1 645 535" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="10 8"/>
<text x="475" y="565" text-anchor="middle" class="head blue">球体</text>
<text x="475" y="596" text-anchor="middle" class="small blue">被驱动旋转；底部接触地面</text>
<!-- body -->
<rect x="370" y="195" width="210" height="145" rx="18" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
<rect x="438" y="218" width="74" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="475" y="245" text-anchor="middle" class="small">IMU</text>
<text x="475" y="292" text-anchor="middle" class="head">机身 / 控制器</text>
<text x="475" y="323" text-anchor="middle" class="small">电池、电脑、传感器</text>
<!-- arms -->
<line x1="380" y1="230" x2="265" y2="200" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
<circle cx="265" cy="200" r="13" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
<line x1="570" y1="230" x2="685" y2="200" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
<circle cx="685" cy="200" r="13" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
<text x="170" y="170" class="label">左臂</text><text x="696" y="170" class="label">右臂</text>
<text x="475" y="160" text-anchor="middle" class="small orange">手臂动作会移动整机质心</text>
<!-- support frame down to wheels -->
<path d="M390 326 L315 420 L270 468 M560 326 L635 420 L680 468" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<!-- motors/wheels contact two visible in side view -->
<rect x="242" y="440" width="54" height="56" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="3" transform="rotate(-25 269 468)"/>
<circle cx="294" cy="484" r="31" fill="#f97316" stroke="#9a3412" stroke-width="4"/>
<circle cx="294" cy="484" r="9" fill="#fff7ed" stroke="#9a3412" stroke-width="3"/>
<rect x="654" y="440" width="54" height="56" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="3" transform="rotate(25 681 468)"/>
<circle cx="656" cy="484" r="31" fill="#f97316" stroke="#9a3412" stroke-width="4"/>
<circle cx="656" cy="484" r="9" fill="#fff7ed" stroke="#9a3412" stroke-width="3"/>
<text x="122" y="415" class="label orange">电机 + 驱动轮</text>
<line x1="250" y1="425" x2="275" y2="455" stroke="#c2410c" stroke-width="3" marker-end="url(#orange)"/>
<text x="687" y="415" class="small orange">另一个轮（侧视可见）</text>
<!-- contact marks -->
<circle cx="316" cy="510" r="7" fill="#dc2626"/><circle cx="634" cy="510" r="7" fill="#dc2626"/>
<text x="104" y="540" class="small">轮面与球面接触</text>
<line x1="248" y1="535" x2="307" y2="514" stroke="#475569" stroke-width="2" marker-end="url(#gray)"/>
<!-- ball spin / translation -->
<path d="M360 590 A125 125 0 0 0 564 603" fill="none" stroke="#1d4ed8" stroke-width="5" marker-end="url(#arrow)"/>
<text x="460" y="670" text-anchor="middle" class="label blue">轮子摩擦带动球转动</text>
<line x1="410" y1="715" x2="570" y2="715" stroke="#1d4ed8" stroke-width="5" marker-end="url(#arrow)"/>
<text x="485" y="786" text-anchor="middle" class="label blue">球在地面滚动，机器人整体平移</text>
<!-- pendulum concept -->
<line x1="475" y1="352" x2="475" y2="535" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>
<circle cx="510" cy="405" r="9" fill="#7c3aed"/>
<line x1="510" y1="405" x2="510" y2="475" stroke="#7c3aed" stroke-width="4" marker-end="url(#gray)"/>
<text x="525" y="445" class="small" fill="#6d28d9">重力</text>
<text x="520" y="375" class="small" fill="#6d28d9">质心 CoM</text>
<text x="520" y="500" class="small muted">倾斜时，重力对支撑处产生倾覆力矩</text>

<!-- TOP VIEW -->
<rect x="930" y="82" width="535" height="730" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1197" y="125" text-anchor="middle" class="head">俯视概念图：三轮绕球心约隔120°</text>
<circle cx="1197" cy="425" r="190" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
<circle cx="1197" cy="425" r="8" fill="#1e3a8a"/>
<text x="1197" y="442" text-anchor="middle" class="small blue">球心</text>
<!-- 3 radii/supports/contact wheels -->
<line x1="1197" y1="425" x2="1197" y2="240" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 7"/>
<line x1="1197" y1="425" x2="1037" y2="517" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 7"/>
<line x1="1197" y1="425" x2="1357" y2="517" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 7"/>
<circle cx="1197" cy="240" r="28" fill="#f97316" stroke="#9a3412" stroke-width="4"/>
<circle cx="1037" cy="517" r="28" fill="#f97316" stroke="#9a3412" stroke-width="4"/>
<circle cx="1357" cy="517" r="28" fill="#f97316" stroke="#9a3412" stroke-width="4"/>
<text x="1197" y="190" text-anchor="middle" class="label orange">轮1</text>
<text x="985" y="565" text-anchor="middle" class="label orange">轮2</text>
<text x="1410" y="565" text-anchor="middle" class="label orange">轮3</text>
<path d="M1197 300 A125 125 0 0 1 1305 487" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#gray)"/>
<text x="1300" y="330" class="small muted">三轮接触方位</text>
<rect x="1080" y="650" width="234" height="80" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="1197" y="682" text-anchor="middle" class="label">轮子固定在机身框架</text>
<text x="1197" y="711" text-anchor="middle" class="small">轮转 → 球转 → 地面滚动</text>

<text x="750" y="870" text-anchor="middle" class="small muted">原理示意，非项目CAD比例图；准确安装角、接触纬度与电机轴向以项目机械图纸和坐标定义为准。</text>
</svg>
